[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waygate"
version = "0.1.0"
description = "Headless WireGuard controller for Project Waygate"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "pydantic-settings==2.14.2",
    "uvicorn==0.51.0",
    "qrcode[png]==8.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[project.scripts]
waygate = "waygate.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waygate = ["migrations/*.sql"]
