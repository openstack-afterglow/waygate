#cloud-config
# Full OpenStack user-data example for a prototype deployment.
# deploy/openstack-create.sh renders __PUBLIC_IP__, __ADMIN_CIDR__, __WEB_PORT__, and __WG_PORT__ before
# passing this file to OpenStack. The API/web console will listen on :__WEB_PORT__.
package_update: true
packages:
  - ca-certificates
  - curl
  - iproute2
  - iptables
  - software-properties-common
  - wireguard-tools

write_files:
  - path: /etc/waygate.env
    owner: root:root
    permissions: '0600'
    content: |
      WG_SERVER_HOST=__PUBLIC_IP__
      API_AUTH_TOKEN=__GENERATE_AT_BOOT__
      API_ALLOWED_CIDRS=__ADMIN_CIDR__
      WG_OUTBOUND_INTERFACE=

      WG_INTERFACE=wg0
      WG_PORT=__WG_PORT__
      WG_SERVER_NET=10.8.0.0/24
      WG_DEFAULT_DNS=1.1.1.1
      API_HOST=0.0.0.0
      API_PORT=__WEB_PORT__
      API_PUBLIC_BASE_URL=http://__PUBLIC_IP__:__WEB_PORT__
      WG_PERSISTENT_KEEPALIVE=25
      # Prototype mode only. Use HTTPS and set this to false in production.
      ALLOW_INSECURE_HTTP=true
      API_DOCS_ENABLED=false

runcmd:
  - [bash, -lc, 'set -euo pipefail; token=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))"); sed -i "s|^API_AUTH_TOKEN=.*|API_AUTH_TOKEN=$token|" /etc/waygate.env']
  - [bash, -lc, 'set -euo pipefail; rm -rf /opt/waygate-source; install -d -m 0755 /opt/waygate-source; curl --fail --location https://github.com/openstack-afterglow/waygate/archive/refs/heads/main.tar.gz | tar -xz --strip-components=1 -C /opt/waygate-source; /opt/waygate-source/deploy/install.sh --env-file /etc/waygate.env --source-dir /opt/waygate-source']
  - [bash, -lc, 'set -euo pipefail; for i in $(seq 1 60); do curl --fail --silent --max-time 2 http://127.0.0.1:__WEB_PORT__/ >/dev/null && exit 0; sleep 2; done; echo "Waygate web console did not become ready" >&2; exit 1']
