#cloud-config
# One-step native VM install. Replace the __PLACEHOLDER__ values first.
# For production, pin the source URL below to a reviewed commit or release.
package_update: true
packages:
  - ca-certificates
  - curl
  - iproute2
  - iptables
  - software-properties-common
  - wireguard-tools

write_files:
  - path: /etc/waygate.env
    owner: root:root
    permissions: '0600'
    content: |
      # Required deployment inputs
      WG_SERVER_HOST=__PUBLIC_WIREGUARD_SERVER_IP_OR_DNS__
      API_AUTH_TOKEN=__RANDOM_TOKEN_AT_LEAST_32_CHARS__
      API_ALLOWED_CIDRS=__ADMINISTRATION_CIDR__
      WG_OUTBOUND_INTERFACE=__DEFAULT_ROUTE_INTERFACE__

      # Native VM defaults
      WG_INTERFACE=wg0
      WG_PORT=51820
      WG_SERVER_NET=10.8.0.0/24
      WG_DEFAULT_DNS=1.1.1.1
      API_HOST=0.0.0.0
      API_PORT=8080
      WG_PERSISTENT_KEEPALIVE=25
      # Set false when an HTTPS reverse proxy terminates the API.
      ALLOW_INSECURE_HTTP=true
      API_DOCS_ENABLED=false

runcmd:
  - [bash, -lc, 'set -euo pipefail; rm -rf /opt/waygate-source; install -d -m 0755 /opt/waygate-source; curl --fail --location https://github.com/openstack-afterglow/waygate/archive/refs/heads/main.tar.gz | tar -xz --strip-components=1 -C /opt/waygate-source; /opt/waygate-source/deploy/install.sh --env-file /etc/waygate.env --source-dir /opt/waygate-source']
