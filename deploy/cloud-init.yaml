#cloud-config
# Native VM bootstrap. Replace every __PLACEHOLDER__ before provisioning.
# The application wheel must already be installed at /opt/afterglow-wg-agent.
package_update: true
packages:
  - iproute2
  - iptables
  - python3-venv
  - wireguard-tools

write_files:
  - path: /etc/afterglow-wg-agent.env
    owner: root:root
    permissions: '0600'
    content: |
      # Required deployment inputs
      WG_SERVER_HOST=__PUBLIC_WIREGUARD_SERVER_IP_OR_DNS__
      API_AUTH_TOKEN=__RANDOM_TOKEN_AT_LEAST_32_CHARS__
      API_ALLOWED_CIDRS=__ADMINISTRATION_CIDR__
      WG_OUTBOUND_INTERFACE=__DEFAULT_ROUTE_INTERFACE__

      # Native VM defaults
      WG_INTERFACE=wg0
      WG_PORT=51820
      WG_SERVER_NET=10.8.0.0/24
      WG_DEFAULT_DNS=1.1.1.1
      API_HOST=0.0.0.0
      API_PORT=8080
      WG_PERSISTENT_KEEPALIVE=25
      ALLOW_INSECURE_HTTP=false
      API_DOCS_ENABLED=false

  - path: /etc/tmpfiles.d/afterglow-wg-agent.conf
    owner: root:root
    permissions: '0644'
    content: |
      f /run/xtables.lock 0600 root root -

runcmd:
  - [sh, -c, 'test -x /opt/afterglow-wg-agent/.venv/bin/afterglow-wg-agent || { echo "afterglow-wg-agent is not installed under /opt" >&2; exit 1; }']
  - [systemd-tmpfiles, --create, /etc/tmpfiles.d/afterglow-wg-agent.conf]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, afterglow-wg-agent.service]
