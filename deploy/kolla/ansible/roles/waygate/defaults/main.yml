---
# Waygate kolla role defaults

waygate_image_tag: "0.1.4"
waygate_image_namespace: "ghcr.io/openstack-afterglow"
waygate_api_image: "{{ waygate_image_namespace }}/waygate-api"
waygate_worker_image: "{{ waygate_image_namespace }}/waygate-worker"

waygate_source_mode: "{{ enable_waygate_source_build | default(enable_source_build | default(waygate_dev_mode | default(false))) | bool }}"
waygate_source_repo: "https://github.com/openstack-afterglow/waygate.git"
waygate_source_version: "1c59b5e86d3c3c1b9d3397b38301ee9bc401cf03"
waygate_source_dir: "{{ waygate_source_checkout_path | default('/opt/afterglow/src/waygate') }}"
waygate_api_image_ref: "{{ 'afterglow-local/waygate-api:' ~ (waygate_source_version | truncate(12, True, '')) if (waygate_source_mode | bool) else (waygate_api_image ~ ':' ~ waygate_image_tag) }}"
waygate_worker_image_ref: "{{ 'afterglow-local/waygate-worker:' ~ (waygate_source_version | truncate(12, True, '')) if (waygate_source_mode | bool) else (waygate_worker_image ~ ':' ~ waygate_image_tag) }}"

enable_waygate: "no"
enable_waygate_api: "{{ enable_waygate }}"
enable_waygate_worker: "{{ enable_waygate }}"
waygate_run_preconditions: true

waygate_api_port: 8010
waygate_api_listen_address: "{{ 'api' | kolla_address(inventory_hostname) }}"
waygate_api_listen_port: 18010
waygate_database_name: "waygate"
waygate_database_user: "waygate"
waygate_database_address: "{{ database_address }}"
waygate_database_port: "{{ database_port }}"
waygate_database_admin_user: "{{ database_user }}"
waygate_database_admin_password: "{{ database_password }}"
waygate_database_url: "mysql+aiomysql://{{ waygate_database_user }}:{{ waygate_database_password }}@{{ waygate_database_address }}:{{ waygate_database_port }}/{{ waygate_database_name }}"
waygate_valkey_host: "{{ 'api' | kolla_address(groups['valkey'][0]) }}"
waygate_valkey_port: "{{ valkey_server_port }}"
waygate_valkey_password: "{{ valkey_master_password }}"
waygate_redis_db_index: 6
waygate_redis_url: "redis://default:{{ waygate_valkey_password }}@{{ waygate_valkey_host }}:{{ waygate_valkey_port }}/{{ waygate_redis_db_index }}"

waygate_keystone_user: "waygate"
waygate_keystone_auth_url: "{{ keystone_internal_url }}"
waygate_keystone_project_domain_name: "{{ default_project_domain_name }}"
waygate_keystone_user_domain_name: "{{ default_user_domain_name }}"
waygate_keystone_region_name: "{{ openstack_region_name }}"
waygate_keystone_interface: "{{ openstack_interface | default('internal') }}"
waygate_service_project_name: "waygate-service"
waygate_external_url: "{{ public_protocol | default('https') }}://{{ kolla_external_fqdn | default('localhost') }}:{{ waygate_api_port }}"
waygate_callback_base_url: "{{ waygate_external_url }}"
waygate_public_endpoint_url: "{{ waygate_external_url }}"
waygate_internal_endpoint_url: "{{ internal_protocol | default('http') }}://{{ kolla_internal_fqdn | default(kolla_internal_vip_address) }}:{{ waygate_api_port }}"
waygate_admin_endpoint_url: "{{ waygate_internal_endpoint_url }}"
waygate_default_tunnel_cidr: "10.8.0.0/24"
waygate_agent_install_mode: "cloud-init"

# Optional Kolla external-VIP route. Keep waygate-api internal so Afterglow
# and Keystone's internal/admin endpoints keep their existing VIP listener.
waygate_public_haproxy_enabled: false
waygate_public_haproxy_fqdn: ""
waygate_default_listen_port: 51820
waygate_key_name: ""

waygate_encryption_key: "{{ afterglow_kubeconfig_encryption_key | default('') }}"
waygate_trusted_proxies: "127.0.0.1/32,::1/128"

waygate_services:
  waygate-api:
    container_name: waygate_api
    group: waygate
    enabled: "{{ enable_waygate_api | bool }}"
    image: "{{ waygate_api_image_ref }}"
    network_mode: host
    command: ["uvicorn", "waygate.main:app", "--host", "{{ waygate_api_listen_address }}", "--port", "{{ waygate_api_listen_port | string }}"]
    restart_policy: unless-stopped
    volumes:
      - "/etc/kolla/waygate/waygate.conf:/app/waygate.conf:ro"
      - "kolla_logs:/var/log/kolla/"
    environment:
      DATABASE_URL: "{{ waygate_database_url }}"
      REDIS_URL: "{{ waygate_redis_url }}"
      OS_PASSWORD: "{{ waygate_keystone_password }}"
      WAYGATE_ENCRYPTION_KEY: "{{ waygate_encryption_key }}"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; response = urlopen('http://{{ waygate_api_listen_address }}:{{ waygate_api_listen_port }}/v1/health', timeout=5); assert response.status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    haproxy:
      waygate-api:
        enabled: "{{ enable_waygate_api | bool }}"
        external: false
        port: "{{ waygate_api_port }}"
        listen_port: "{{ waygate_api_listen_port }}"
        host_group: waygate
        frontend_http_extra:
          - "option forwardfor"
        backend_http_extra:
          - "option httpchk GET /v1/health"
          - "http-check expect status 200"

  waygate-worker:
    container_name: waygate_worker
    group: waygate
    enabled: "{{ enable_waygate_worker | bool }}"
    image: "{{ waygate_worker_image_ref }}"
    command: ["python", "-m", "waygate.worker"]
    network_mode: host
    restart_policy: unless-stopped
    volumes:
      - "/etc/kolla/waygate/waygate.conf:/app/waygate.conf:ro"
      - "kolla_logs:/var/log/kolla/"
    environment:
      DATABASE_URL: "{{ waygate_database_url }}"
      REDIS_URL: "{{ waygate_redis_url }}"
      OS_PASSWORD: "{{ waygate_keystone_password }}"
      WAYGATE_ENCRYPTION_KEY: "{{ waygate_encryption_key }}"

waygate_public_haproxy_services:
  waygate-public:
    group: waygate
    enabled: "{{ enable_waygate_api | bool and waygate_public_haproxy_enabled | bool }}"
    haproxy:
      waygate-public:
        enabled: "{{ enable_waygate_api | bool and waygate_public_haproxy_enabled | bool }}"
        external: true
        external_fqdn: "{{ waygate_public_haproxy_fqdn }}"
        mode: http
        with_frontend: true
        with_backend: true
        host_group: waygate
        port: "{{ waygate_api_port }}"
        listen_port: "{{ waygate_api_listen_port }}"
        frontend_http_extra:
          - "option forwardfor"
        backend_http_extra:
          - "option httpchk GET /v1/health"
          - "http-check expect status 200"

waygate_haproxy_services: "{{ waygate_services | combine(waygate_public_haproxy_services, recursive=True) }}"
