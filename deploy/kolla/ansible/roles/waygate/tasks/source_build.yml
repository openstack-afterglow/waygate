---
- name: Source Build | Ensure Waygate source checkout directory exists
  become: true
  ansible.builtin.file:
    path: "{{ waygate_source_dir }}"
    state: directory
    mode: "0755"
  when: inventory_hostname in groups['waygate']

- name: Source Build | Check if existing Git repository exists
  become: true
  ansible.builtin.stat:
    path: "{{ waygate_source_dir }}/.git"
  register: waygate_git_dir_stat
  when: inventory_hostname in groups['waygate']

- name: Source Build | Check git status of existing checkout
  become: true
  ansible.builtin.command:
    cmd: "git status --porcelain"
    chdir: "{{ waygate_source_dir }}"
  register: waygate_existing_git_status
  changed_when: false
  when:
    - inventory_hostname in groups['waygate']
    - waygate_git_dir_stat.stat.exists

- name: Source Build | Fail if existing Waygate checkout is dirty
  ansible.builtin.assert:
    that:
      - waygate_existing_git_status.stdout | trim | length == 0
    fail_msg: "Existing Waygate source checkout at {{ waygate_source_dir }} is dirty (uncommitted changes present)"
  when:
    - inventory_hostname in groups['waygate']
    - waygate_git_dir_stat.stat.exists

- name: Source Build | Check HEAD SHA of existing checkout
  become: true
  ansible.builtin.command:
    cmd: "git rev-parse HEAD"
    chdir: "{{ waygate_source_dir }}"
  register: waygate_existing_head_sha
  changed_when: false
  when:
    - inventory_hostname in groups['waygate']
    - waygate_git_dir_stat.stat.exists

- name: Source Build | Fail if existing Waygate checkout HEAD does not match waygate_source_version
  ansible.builtin.assert:
    that:
      - waygate_existing_head_sha.stdout | trim == waygate_source_version
    fail_msg: "Existing Waygate checkout HEAD ({{ waygate_existing_head_sha.stdout | default('') }}) does not match required version ({{ waygate_source_version }})"
  when:
    - inventory_hostname in groups['waygate']
    - waygate_git_dir_stat.stat.exists

- name: Source Build | Checkout Waygate source repository when absent
  become: true
  ansible.builtin.git:
    repo: "{{ waygate_source_repo }}"
    dest: "{{ waygate_source_dir }}"
    version: "{{ waygate_source_version }}"
    force: false
  when:
    - inventory_hostname in groups['waygate']
    - not waygate_git_dir_stat.stat.exists

- name: Source Build | Verify checked out HEAD SHA
  become: true
  ansible.builtin.command:
    cmd: "git rev-parse HEAD"
    chdir: "{{ waygate_source_dir }}"
  register: waygate_head_sha
  changed_when: false
  when: inventory_hostname in groups['waygate']

- name: Source Build | Fail if checked out HEAD does not match waygate_source_version
  ansible.builtin.assert:
    that:
      - waygate_head_sha.stdout | trim == waygate_source_version
    fail_msg: "Waygate source checkout HEAD ({{ waygate_head_sha.stdout | default('') }}) does not match expected version ({{ waygate_source_version }})"
  when: inventory_hostname in groups['waygate']

- name: Source Build | Build local Waygate images
  become: true
  community.docker.docker_image:
    name: "afterglow-local/{{ item }}:{{ waygate_source_version | truncate(12, True, '') }}"
    build:
      path: "{{ waygate_source_dir }}"
      target: "{{ item }}"
    source: build
    force_source: false
  loop:
    - waygate-api
    - waygate-worker
  when: inventory_hostname in groups['waygate']
