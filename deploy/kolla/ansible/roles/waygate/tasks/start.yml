---
- name: Start | Stat Waygate config file
  become: true
  ansible.builtin.stat:
    path: "{{ waygate_config_dir }}/waygate.conf"
  register: waygate_config_stat
  when: inventory_hostname in groups['waygate']

- name: Start | Start Waygate containers
  become: true
  community.docker.docker_container:
    name: "{{ item.value.container_name }}"
    image: "{{ item.value.image }}"
    pull: "{{ 'never' if (waygate_source_mode | default(false) | bool) else 'always' }}"
    state: started
    restart_policy: "{{ item.value.restart_policy | default('unless-stopped') }}"
    volumes: "{{ item.value.volumes | default([]) }}"
    env: "{{ item.value.environment | default({}) }}"
    command: "{{ item.value.command | default(omit) }}"
    healthcheck: "{{ item.value.healthcheck | default(omit) }}"
    ports: "{{ item.value.ports | default([]) }}"
    network_mode: "{{ item.value.network_mode | default(omit) }}"
    labels:
      kolla_version: "2025.2"
      service: waygate
      config_hash: "{{ waygate_config_stat.stat.checksum | default('') }}"
  no_log: true
  loop: "{{ waygate_services | dict2items }}"
  when:
    - inventory_hostname in groups['waygate']
    - item.value.enabled | bool
