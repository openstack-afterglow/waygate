---
- name: HAProxy | Remove disabled Waygate public route destination
  become: true
  ansible.builtin.file:
    path: "{{ node_config_directory }}/haproxy/services.d/waygate-public.cfg"
    state: absent
  when: not (waygate_public_haproxy_enabled | bool)

- name: HAProxy | Remove disabled Waygate external frontend map
  become: true
  ansible.builtin.blockinfile:
    path: "{{ node_config_directory }}/haproxy/external-frontend-map"
    marker: "# {mark} waygate-public"
    state: absent
  when: not (waygate_public_haproxy_enabled | bool)

- name: Configure loadbalancer for Waygate
  ansible.builtin.import_role:
    name: loadbalancer-config
  vars:
    project_name: waygate
    project_services: "{{ waygate_haproxy_services }}"
  tags: always
