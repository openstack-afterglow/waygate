---
- name: Config | Ensure Waygate config directory exists
  become: true
  ansible.builtin.file:
    path: "{{ waygate_config_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root
  when: inventory_hostname in groups['waygate']

- name: Config | Render waygate.conf
  become: true
  ansible.builtin.template:
    src: waygate.conf.j2
    dest: "{{ waygate_config_dir }}/waygate.conf"
    mode: "0640"
    owner: root
    group: root
  when: inventory_hostname in groups['waygate']
