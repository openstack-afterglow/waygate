name: CI

# Push, tag and dispatch runs execute this workflow once through Docker Build &
# Push's `test` job (workflow_call), which gates the image publish. A separate push
# trigger here would run the identical ci.yml a second time for the same push.
on:
  workflow_call:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  service:
    name: Service tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check architecture snapshot
        run: python3 scripts/check_architecture.py
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --extra service --extra dev --frozen
      # 4 workers match the 4 vCPU public ubuntu-latest runner; never `-n auto`.
      - run: uv run pytest tests -n 4 --dist worksteal
      - run: uv run ruff check .

  sdk:
    name: SDK tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run pytest
      - run: uv run ruff check .
